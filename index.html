<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYD Prize Winner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top-controls">
<button id="openSettings">⚙️ Settings</button>
<button id="fullscreenBtn">📺 Fullscreen</button>
<button id="rotateBtn">🔄 Rotate</button>
</div>

<div class="container">
<h1>BYD Prize Winner</h1>
<div class="slot-box"><div id="displayName">พร้อมใช้งาน</div></div>
<div id="counter">เหลือ 0 คน</div>
<button id="drawBtn">DRAW</button>
</div>

<div class="settings" id="settingsPanel">
<h2>Settings</h2>
<textarea id="nameList" rows="10"></textarea>
<input id="eliminatedLabel" value="ถูกคัดออก">
<input id="winnerLabel" value="ผู้ได้รับรางวัล">
<button id="saveBtn">Save & Close</button>
<h3>History</h3>
<ul id="historyList"></ul>
</div>

<div class="modal" id="winnerModal">
<div class="modal-content">
<div class="trophy">🏆</div>
<h2 id="winnerTitle"></h2>
<button onclick="closeModal()">Close</button>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
